name: Build and Push Boutique Containers

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-main.yml'
      - 'container-images/docker-compose.yml'
  workflow_dispatch:

env:
  DOCR: registry.digitalocean.com/idpreg
  SHA_TAG: sha-${{ github.sha }}

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Login to Digital Ocean Container Registry
        run: doctl registry login

      - name: Build all images
        run: docker compose -f container-images/docker-compose.yml build

      - name: Tag with Git Commit SHA
        run: |
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "$DOCR" | while read -r img; do
          # Safely remove the existing tag and apply the unique SHA tag
            BASE_IMG=$(echo "$img" | cut -d: -f1)
            docker tag "$img" "$(echo "$img" | cut -d: -f1):$SHA_TAG"
          done

      - name: Scan built images with Trivy
        run: |
          docker pull aquasec/trivy:0.57.0 > /dev/null 2>&1
          mkdir -p /tmp/trivy-cache
          # Dynamically capture all SHA-tagged images for scanning
           IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "$DOCR" | grep "$SHA_TAG")
          
          IS_FIRST_RUN=true
          for img in $IMAGES; do
            echo "🔎 Scanning: $img"
            
          # Build database flags dynamically so it doesn't redownload for each image
            DB_FLAGS=""
            if [ "$IS_FIRST_RUN" = false ]; then
              DB_FLAGS="--skip-db-update"
            fi
            
            # Put global flag '--skip-version-check' BEFORE the subcommand 'image'
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache \
              aquasec/trivy:0.57.0 image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              $DB_FLAGS \
              "$img"
              
            IS_FIRST_RUN=false
          done

      - name: Push all SHA-tagged images to DOCR registry
        run: |
          # push both 'latest' (if built) and the unique SHA tags
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "$DOCR" | grep "$SHA_TAG" | while read -r img; do
          echo "Pushing image: $img"
          docker push "$img"
          done
# uses the pat from doctl login to upload the signature, but uses oidc to generate the signature
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign remote images
        run: |
          # Re-gather images to ensure they match exactly what is in remote registry
          IMAGES=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep "$DOCR" | grep "$SHA_TAG")
          for img in $IMAGES; do
            echo "🔏 Signing Remote Image: $img"
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$img"
          done
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

      - name: Checkout Infrastructure Repository
        uses: actions/checkout@v7
        with:
          repository: susu10-10/online-boutique-doks-pf
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Install Kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tags
        run: |
          cd infra/apps/boutique

          for SERVICE in \
            frontend \
            adservice \
            cartservice \
            checkoutservice \
            emailservice \
            paymentservice \
            productcatalogservice \
            recommendationservice \
            shippingservice \
            currencyservice
          do
            kustomize edit set image \
            registry.digitalocean.com/idpreg/$SERVICE:$SHA_TAG
          done


      - name: Commit infra changes
        run: |
          cd infra

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apps/boutique/kustomization.yaml
          git commit -m "Update images to $SHA_TAG" || exit 0
          git push