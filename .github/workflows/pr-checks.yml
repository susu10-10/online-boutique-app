name: PR Scan Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      #- 'container-images/**'
      - '.github/workflows/**'
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  check-security:
    uses: ./.github/workflows/security-essential.yml
  code-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: "./.dotnet"
      with:
        dotnet-version: '10.0'
    - uses: actions/setup-go@v7
      with:
        go-version: '1.26'
    - name: Go Unit Tests
      timeout-minutes: 10
      run: |
        for SERVICE in "shippingservice" "productcatalogservice"; do
          echo "testing $SERVICE..."
          pushd src/$SERVICE
          go test
          popd
        done
    - name: C# Unit Tests
      timeout-minutes: 10
      run: |
        dotnet test src/cartservice/
